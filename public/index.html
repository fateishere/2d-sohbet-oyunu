<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siber Evren - Vent & Voice</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');
        
        body { margin: 0; background: #050508; color: #fff; font-family: 'Rajdhani', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        
        /* GENİŞLETİLMİŞ MENÜ */
        #menuUI { position: fixed; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #0f172a 0%, #000000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.5s; }
        .box { background: rgba(15, 23, 42, 0.6); padding: 40px; border-radius: 20px; border: 1px solid rgba(0, 255, 245, 0.3); backdrop-filter: blur(15px); text-align: center; box-shadow: 0 0 50px rgba(0,255,245,0.1); width: 90%; max-width: 450px; }
        h1 { font-weight: 700; font-size: 3rem; margin-bottom: 5px; color: #00fff5; text-shadow: 0 0 20px rgba(0,255,245,0.5); letter-spacing: 2px; }
        .menu-row { display: flex; gap: 15px; margin-bottom: 20px; }
        input, select { padding: 15px; width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #334155; color: white; border-radius: 10px; font-family: 'Rajdhani'; font-size: 18px; outline: none; }
        input:focus, select:focus { border-color: #00fff5; box-shadow: 0 0 10px rgba(0,255,245,0.3); }
        .btn { padding: 15px; width: 100%; background: #00fff5; color: #000; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; font-size: 20px; text-transform: uppercase; box-shadow: 0 0 15px rgba(0,255,245,0.4); transition: 0.2s; }
        .btn:hover { background: #fff; box-shadow: 0 0 25px #fff; transform: scale(1.02); }
        .info-text { font-size: 14px; color: #94a3b8; margin-top: 15px; line-height: 1.5; }

        #gameArea { display: none; width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; }
        
        /* ARAYÜZ ELEMANLARI */
        #chatLogBox { position: absolute; top: 20px; left: 20px; width: 300px; height: 250px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 10; font-size: 16px; backdrop-filter: blur(5px); }
        .log-msg { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; word-wrap: break-word; }

        #inputArea { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; z-index: 10; }
        #chatInput { margin: 0; width: 100%; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.8); }

        /* MOBİL VE PC KONTROLLER (Vent, Mikrofon, Joystick) */
        #actionContainer { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 15px; z-index: 20; }
        .action-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(15,23,42,0.8); border: 2px solid #00fff5; color: #00fff5; font-size: 14px; font-weight: bold; font-family: 'Rajdhani'; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 15px rgba(0,255,245,0.3); }
        .action-btn.active { background: #00fff5; color: #000; }
        #ventMenu { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 30px; border: 2px solid #ff0055; border-radius: 15px; z-index: 50; text-align: center; }
        
        /* SANAL JOYSTICK (Mobilde kaymak gibi hareket) */
        #joystickZone { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; z-index: 20; display: none; }
        #joystickKnob { position: absolute; top: 50px; left: 50px; width: 50px; height: 50px; background: rgba(0,255,245,0.5); border-radius: 50%; pointer-events: none; transition: 0.1s ease-out; }

        @media (max-width: 768px) {
            #joystickZone { display: block; }
            #chatLogBox { width: 200px; height: 150px; font-size: 14px; top: 10px; left: 10px; }
            #inputArea { bottom: 180px; } /* Klavyeden kaçmak için yukarı al */
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="menuUI">
        <div class="box">
            <h1>SİBER EVREN</h1>
            <p class="info-text">Mikrofon izni istenecek, sesli sohbet için [V] basılı tut.</p>
            <input type="text" id="username" placeholder="Sörfçü Adın" maxlength="15">
            <div class="menu-row">
                <select id="colorSelect">
                    <option value="#00fff5">Siyan Ruhu</option>
                    <option value="#ff0055">Kızıl Öfke</option>
                    <option value="#39ff14">Zehir Matrisi</option>
                    <option value="#ffaa00">Güneş Çekirdeği</option>
                </select>
                <select id="modelSelect">
                    <option value="drone">Delta Drone</option>
                    <option value="orb">Plazma Küresi</option>
                    <option value="hexa">Hexa Tank</option>
                </select>
            </div>
            <button class="btn" onclick="joinGame()">BAĞLANTIYI BAŞLAT</button>
        </div>
    </div>

    <div id="gameArea">
        <canvas id="gameCanvas"></canvas>
        <div id="chatLogBox"></div>
        <div id="inputArea"><input type="text" id="chatInput" placeholder="Mesaj..." autocomplete="off"></div>
        
        <div id="joystickZone"><div id="joystickKnob"></div></div>
        
        <div id="actionContainer">
            <div id="ventBtn" class="action-btn" onclick="interactVent()" style="display:none; border-color: #ff0055; color: #ff0055;">VENT (E)</div>
            <div id="micBtn" class="action-btn">MIC (V)</div>
        </div>

        <div id="ventMenu">
            <h2 style="color: #ff0055; margin-top:0;">HAVALANDIRMA AĞI</h2>
            <div style="display: flex; gap:10px; flex-wrap: wrap; justify-content: center; width: 200px;">
                <button class="btn" style="background:#ff0055;" onclick="travelVent(1)">KuzeyBatı (1)</button>
                <button class="btn" style="background:#ff0055;" onclick="travelVent(2)">KuzeyDoğu (2)</button>
                <button class="btn" style="background:#ff0055;" onclick="travelVent(3)">Merkez (3)</button>
                <button class="btn" style="background:#ff0055;" onclick="travelVent(4)">GüneyBatı (4)</button>
                <button class="btn" style="background:#ff0055;" onclick="travelVent(5)">GüneyDoğu (5)</button>
            </div>
        </div>
    </div>

<script>
    const socket = io();
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const chatLogBox = document.getElementById("chatLogBox");
    
    let gameState = null;
    let myId = null;
    let camera = { x: 0, y: 0 };
    let rotAngle = 0; // Modellerin sürekli dönmesi için
    let moveVector = { x: 0, y: 0 };

    // SESLİ SOHBET (Voice Chat) KURULUMU
    let mediaRecorder;
    let isRecording = false;

    async function initVoiceChat() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) socket.emit('voiceStream', e.data);
            };
        } catch (err) {
            console.log("Mikrofon izni verilmedi veya desteklenmiyor.", err);
        }
    }

    // Bas-Konuş Mantığı
    function startVoice() { if(mediaRecorder && mediaRecorder.state === 'inactive') { mediaRecorder.start(100); isRecording = true; document.getElementById('micBtn').classList.add('active'); } }
    function stopVoice() { if(mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); isRecording = false; document.getElementById('micBtn').classList.remove('active'); } }

    socket.on('voiceStream', (data) => {
        // Gelen sesi Web Audio ile anında çal
        const blob = new Blob([data.audio], { type: 'audio/webm;codecs=opus' });
        const audioUrl = URL.createObjectURL(blob);
        const audio = new Audio(audioUrl);
        audio.play().catch(e => console.log(e));
    });

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    function joinGame() {
        initVoiceChat(); // Mikrofonu aktifleştir
        socket.emit("joinGame", { 
            name: document.getElementById("username").value.trim() || "Oyuncu", 
            color: document.getElementById("colorSelect").value,
            modelType: document.getElementById("modelSelect").value
        });
        
        document.getElementById("menuUI").style.opacity = "0";
        setTimeout(() => { document.getElementById("menuUI").style.display = "none"; document.getElementById("gameArea").style.display = "block"; }, 500);
        requestAnimationFrame(gameLoop);
    }

    socket.on("connect", () => { myId = socket.id; });
    socket.on("gameState", (state) => { gameState = state; checkVentDistance(); });
    
    socket.on("newChatMessage", (data) => {
        const div = document.createElement("div"); div.className = "log-msg";
        div.innerHTML = `<span style="color:${data.color}; font-weight:bold;">${data.name}:</span> ${data.text}`;
        chatLogBox.appendChild(div); chatLogBox.scrollTop = chatLogBox.scrollHeight;
    });

    // Vektörel Klavye Kontrolleri (Akıcı)
    const keys = {};
    window.addEventListener("keydown", (e) => {
        if (document.activeElement === document.getElementById('chatInput')) return;
        keys[e.key.toLowerCase()] = true;
        if (e.key.toLowerCase() === 'e') interactVent();
        if (e.key.toLowerCase() === 'v') startVoice();
        updateMovement();
    });
    window.addEventListener("keyup", (e) => {
        if (e.key === 'Enter' && document.activeElement === document.getElementById('chatInput')) {
            const val = document.getElementById('chatInput').value;
            if(val) socket.emit('chat', val);
            document.getElementById('chatInput').value = '';
        }
        keys[e.key.toLowerCase()] = false;
        if (e.key.toLowerCase() === 'v') stopVoice();
        updateMovement();
    });

    function updateMovement() {
        moveVector = { x: 0, y: 0 };
        if (keys["w"] || keys["arrowup"]) moveVector.y = -1;
        if (keys["s"] || keys["arrowdown"]) moveVector.y = 1;
        if (keys["a"] || keys["arrowleft"]) moveVector.x = -1;
        if (keys["d"] || keys["arrowright"]) moveVector.x = 1;
        
        // Çapraz gidişi normalize et (Hızlı çapraz gitmeyi engeller)
        if(moveVector.x !== 0 && moveVector.y !== 0) {
            let length = Math.sqrt(moveVector.x**2 + moveVector.y**2);
            moveVector.x /= length; moveVector.y /= length;
        }
        socket.emit('move', moveVector);
    }

    // SANAL JOYSTICK MANTIĞI
    const joyZone = document.getElementById('joystickZone');
    const joyKnob = document.getElementById('joystickKnob');
    let joyCenter = {x: 75, y: 75}; // zone div'in merkezi (150/2)
    
    joyZone.addEventListener('touchstart', handleJoy);
    joyZone.addEventListener('touchmove', handleJoy);
    joyZone.addEventListener('touchend', () => {
        joyKnob.style.transform = `translate(0px, 0px)`;
        moveVector = {x: 0, y: 0};
        socket.emit('move', moveVector);
    });

    function handleJoy(e) {
        e.preventDefault();
        const rect = joyZone.getBoundingClientRect();
        const touch = e.touches[0];
        let dx = (touch.clientX - rect.left) - joyCenter.x;
        let dy = (touch.clientY - rect.top) - joyCenter.y;
        
        const dist = Math.hypot(dx, dy);
        const maxRadius = 50;
        
        // Dışarı taşmayı engelle
        if (dist > maxRadius) {
            dx = (dx / dist) * maxRadius;
            dy = (dy / dist) * maxRadius;
        }
        
        joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        
        // Değerleri -1 ile 1 arasına çekip sunucuya yolla
        moveVector = { x: dx / maxRadius, y: dy / maxRadius };
        socket.emit('move', moveVector);
    }

    // Mobil Mic Butonu
    const micBtn = document.getElementById('micBtn');
    micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startVoice(); });
    micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopVoice(); });

    // VENT MANTIĞI
    function checkVentDistance() {
        if(!gameState || !gameState.players[myId]) return;
        let me = gameState.players[myId];
        let ventBtn = document.getElementById('ventBtn');
        let ventMenu = document.getElementById('ventMenu');
        
        if (me.inVent) {
            ventBtn.style.display = 'flex';
            ventBtn.innerText = 'ÇIK (E)';
            ventMenu.style.display = 'block';
            return;
        } else {
            ventMenu.style.display = 'none';
        }

        let nearVent = gameState.map.vents.some(v => Math.hypot(v.x - me.x, v.y - me.y) < 80);
        if (nearVent) {
            ventBtn.style.display = 'flex';
            ventBtn.innerText = 'GİR (E)';
        } else {
            ventBtn.style.display = 'none';
        }
    }
    
    function interactVent() { socket.emit('toggleVent'); }
    function travelVent(id) { socket.emit('travelVent', id); }

    // ÇİZİM MOTORU (GELİŞMİŞ MODELLER)
    function drawModel(x, y, color, type) {
        ctx.save();
        ctx.translate(x, y);
        
        // Ortak Parlama Efekti
        ctx.shadowBlur = 20; ctx.shadowColor = color;
        ctx.strokeStyle = color; ctx.lineWidth = 2;

        if (type === 'drone') {
            ctx.rotate(rotAngle);
            // Dış üçgen (Dönüyor)
            ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(22, 12); ctx.lineTo(-22, 12); ctx.closePath(); ctx.stroke();
            // İç Çekirdek (Ters dönüyor)
            ctx.rotate(-rotAngle * 2);
            ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
        } 
        else if (type === 'orb') {
            // Plazma Küresi
            ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.rotate(rotAngle * 1.5);
            ctx.beginPath(); ctx.ellipse(0, 0, 25, 8, 0, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(0, 0, 8, 25, 0, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
        }
        else if (type === 'hexa') {
            // Ağır Altıgen
            ctx.rotate(rotAngle * 0.5);
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                ctx.lineTo(25 * Math.cos(i * Math.PI / 3), 25 * Math.sin(i * Math.PI / 3));
            }
            ctx.closePath(); ctx.stroke();
            ctx.fillStyle = color; ctx.fillRect(-8, -8, 16, 16);
        }
        
        ctx.restore();
    }

    function gameLoop() {
        ctx.fillStyle = "#050508";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        rotAngle += 0.05;

        if (!gameState || !gameState.players[myId]) { requestAnimationFrame(gameLoop); return; }
        let me = gameState.players[myId];
        
        // Yumuşak Kamera (Lerp)
        camera.x += (me.x - canvas.width / 2 - camera.x) * 0.1;
        camera.y += (me.y - canvas.height / 2 - camera.y) * 0.1;

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Siber Izgara Arkaplan
        ctx.strokeStyle = "rgba(0, 255, 245, 0.05)"; ctx.lineWidth = 1;
        for (let x = 0; x <= gameState.map.width; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, gameState.map.height); ctx.stroke(); }
        for (let y = 0; y <= gameState.map.height; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(gameState.map.width, y); ctx.stroke(); }

        // Ventleri Çiz
        gameState.map.vents.forEach(v => {
            ctx.fillStyle = "#1e293b"; ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 3;
            ctx.shadowBlur = 15; ctx.shadowColor = "#ff0055";
            ctx.fillRect(v.x - 40, v.y - 40, 80, 80);
            ctx.strokeRect(v.x - 40, v.y - 40, 80, 80);
            // Izgaralar
            ctx.shadowBlur = 0;
            for(let i = -30; i <= 30; i+=15) {
                ctx.beginPath(); ctx.moveTo(v.x - 35, v.y + i); ctx.lineTo(v.x + 35, v.y + i); ctx.stroke();
            }
        });

        // Oyuncuları Çiz
        for (let id in gameState.players) {
            let p = gameState.players[id];
            if (p.inVent) continue; // Ventin içindeyse çizme (Görünmez)

            drawModel(p.x, p.y, p.color, p.modelType);

            // İsim Etiketi
            ctx.fillStyle = "white"; ctx.font = "bold 16px Rajdhani"; ctx.textAlign = "center";
            ctx.fillText(p.name, p.x, p.y + 40);

            // Mesaj Balonu
            if (p.msg) {
                ctx.font = "bold 14px Arial";
                let msgW = ctx.measureText(p.msg).width + 20;
                ctx.fillStyle = "rgba(255,255,255,0.9)";
                ctx.beginPath(); ctx.roundRect(p.x - msgW/2, p.y - 60, msgW, 30, 8); ctx.fill();
                ctx.fillStyle = "black"; ctx.fillText(p.msg, p.x, p.y - 40);
            }
        }
        ctx.restore();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
