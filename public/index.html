<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- MOBİL UYUM İÇİN ZORUNLU ETİKET -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sohbet Evreni - Mobil & Ses Destekli</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        
        body { margin: 0; background: #0a0a12; color: #fff; font-family: 'Poppins', sans-serif; overflow: hidden; touch-action: none; }
        
        /* GİRİŞ EKRANI */
        #menuUI { position: fixed; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #1f1c2c 0%, #000000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.5s; }
        .box { background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 80%; max-width: 400px; }
        h1 { font-weight: 800; font-size: 2rem; background: -webkit-linear-gradient(#00fff5, #ff00c8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input, select { padding: 15px; width: calc(100% - 30px); margin-bottom: 20px; background: rgba(0,0,0,0.4); border: 2px solid #333; color: white; border-radius: 10px; font-family: 'Poppins'; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: #00fff5; }
        .btn { padding: 15px; width: 100%; background: linear-gradient(45deg, #00fff5, #0055ff); color: white; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* OYUN İÇİ ARAYÜZ (HUD) */
        #gameArea { display: none; width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; }
        
        /* SOHBET GEÇMİŞİ KUTUSU */
        #chatLogBox { position: absolute; top: 20px; left: 20px; width: 300px; height: 250px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 10; font-size: 14px; backdrop-filter: blur(5px); }
        .log-msg { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; word-wrap: break-word; }
        .sys-msg { color: #ffeb3b; font-style: italic; font-size: 12px; }

        /* MESAJ YAZMA KUTUSU */
        #inputArea { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; display: flex; gap: 10px; z-index: 10; }
        #chatInput { margin: 0; width: 100%; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.8); }
        
        /* MOBİL KONTROLLER (Sadece mobilde görünür) */
        #mobileControls { display: none; position: absolute; bottom: 100px; left: 20px; width: 150px; height: 150px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 5px; z-index: 20; }
        .d-btn { background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; user-select: none; }
        .d-btn:active { background: rgba(255,255,255,0.4); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        /* Medya Sorgusu: Ekran küçükse mobil kontrolleri göster, sohbet günlüğünü küçült */
        @media (max-width: 768px) {
            #mobileControls { display: grid; }
            #chatLogBox { width: 200px; height: 150px; font-size: 12px; }
            #inputArea { bottom: 10px; }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="menuUI">
        <div class="box">
            <h1>NEON SOHBET</h1>
            <p style="color: #aaa; font-size: 12px; margin-top: -15px;">Özel ses çalmak için sohbete /ses <link> yazın.</p>
            <input type="text" id="username" placeholder="Karakter Adın" maxlength="15">
            <select id="colorSelect">
                <option value="#00d2ff">Buz Mavisi</option>
                <option value="#ff004c">Neon Kırmızı</option>
                <option value="#39ff14">Zehir Yeşili</option>
                <option value="#f9a826">Güneş Turuncusu</option>
                <option value="#a200ff">Galaksi Moru</option>
            </select>
            <button class="btn" onclick="joinGame()">Evrene Katıl</button>
        </div>
    </div>

    <!-- OYUN ALANI -->
    <div id="gameArea">
        <canvas id="gameCanvas"></canvas>
        
        <div id="chatLogBox"></div>
        
        <div id="inputArea">
            <input type="text" id="chatInput" placeholder="Sohbet et veya komut gir (/ses URL)..." autocomplete="off">
        </div>

        <!-- MOBİL D-PAD -->
        <div id="mobileControls" style="display: none;">
            <div class="d-btn" id="btn-up">▲</div>
            <div class="d-btn" id="btn-left">◀</div>
            <div class="d-btn" id="btn-right">▶</div>
            <div class="d-btn" id="btn-down">▼</div>
        </div>
    </div>

<script>
    const socket = io();
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const chatInput = document.getElementById("chatInput");
    const chatLogBox = document.getElementById("chatLogBox");

    let gameState = null;
    let myId = null;
    let camera = { x: 0, y: 0 };
    const keys = {};
    
    // Görsel Efektler (Parçacıklar ve Oyuncu İzleri)
    const particles = [];
    const playerTrails = {};

    // Gömülü Ses Efektleri (Telifsiz genel URL'ler)
    const sfx = {
        msg: new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3'),
        join: new Audio('https://www.soundjay.com/buttons/sounds/button-10.mp3'),
        leave: new Audio('https://www.soundjay.com/buttons/sounds/button-04.mp3')
    };
    Object.values(sfx).forEach(audio => audio.volume = 0.3); // Ses seviyesini kıs

    // Boyutlandırma
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // Mobildeyse D-Pad'i göster
        document.getElementById('mobileControls').style.display = window.innerWidth <= 768 ? 'grid' : 'none';
    }
    window.addEventListener('resize', resize);
    resize();

    // Arka plan parçacıklarını oluştur
    for(let i=0; i<150; i++) {
        particles.push({
            x: Math.random() * 2000, y: Math.random() * 2000,
            size: Math.random() * 2, speed: Math.random() * 0.5
        });
    }

    function joinGame() {
        const name = document.getElementById("username").value.trim() || "Oyuncu";
        const color = document.getElementById("colorSelect").value;
        
        socket.emit("joinGame", { name, color });
        
        document.getElementById("menuUI").style.opacity = "0";
        setTimeout(() => {
            document.getElementById("menuUI").style.display = "none";
            document.getElementById("gameArea").style.display = "block";
        }, 500);

        requestAnimationFrame(gameLoop);
    }

    // Soket Dinleyicileri
    socket.on("connect", () => { myId = socket.id; });
    socket.on("gameState", (state) => { gameState = state; });
    
    // Ses Çalma Emirleri
    socket.on("playSound", (type) => { if(sfx[type]) sfx[type].play().catch(e=>console.log(e)); });
    socket.on("playCustomSound", (url) => { 
        try { 
            let customAudio = new Audio(url); 
            customAudio.volume = 0.5;
            customAudio.play(); 
        } catch(e) { console.log("Ses çalınamadı:", e); } 
    });

    // Sohbet Günlüğü Güncellemesi
    socket.on("newChatMessage", (data) => {
        const div = document.createElement("div");
        div.className = "log-msg";
        div.innerHTML = `<span style="color:${data.color}; font-weight:bold;">${data.name}:</span> ${data.text}`;
        chatLogBox.appendChild(div);
        chatLogBox.scrollTop = chatLogBox.scrollHeight; // Otomatik aşağı kaydır
    });
    socket.on("serverMessage", (msg) => {
        const div = document.createElement("div"); div.className = "sys-msg"; div.innerText = msg;
        chatLogBox.appendChild(div);
        chatLogBox.scrollTop = chatLogBox.scrollHeight;
    });

    // Klavye Kontrolleri
    window.addEventListener("keydown", (e) => {
        if (document.activeElement === chatInput) { 
            if (e.key === "Enter") sendMsg();
            socket.emit('typing', true);
            return; 
        }
        keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener("keyup", (e) => {
        if (document.activeElement === chatInput) { socket.emit('typing', false); return; }
        delete keys[e.key.toLowerCase()];
    });

    // Mobil Dokunmatik Kontroller
    function setupMobileButton(id, dir) {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[dir] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); delete keys[dir]; });
    }
    setupMobileButton('btn-up', 'w');
    setupMobileButton('btn-down', 's');
    setupMobileButton('btn-left', 'a');
    setupMobileButton('btn-right', 'd');

    // Hareket Döngüsü
    setInterval(() => {
        if (document.activeElement === chatInput) return;
        if (keys["w"] || keys["arrowup"]) socket.emit("move", "UP");
        if (keys["s"] || keys["arrowdown"]) socket.emit("move", "DOWN");
        if (keys["a"] || keys["arrowleft"]) socket.emit("move", "LEFT");
        if (keys["d"] || keys["arrowright"]) socket.emit("move", "RIGHT");
    }, 30);

    function sendMsg() {
        if (chatInput.value.trim() !== "") { 
            socket.emit("chat", chatInput.value); 
            chatInput.value = ""; 
            socket.emit('typing', false);
        }
    }

    // --- KAMERA VE ÇİZİM MOTORU ---
    function gameLoop() {
        ctx.fillStyle = "#0a0a12";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (!gameState || !gameState.players[myId]) { requestAnimationFrame(gameLoop); return; }

        let me = gameState.players[myId];
        
        // Kamera Takibi (Yumuşak Geçiş)
        camera.x += (me.x - canvas.width / 2 - camera.x) * 0.1;
        camera.y += (me.y - canvas.height / 2 - camera.y) * 0.1;

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Arka Plan Izgarası ve Parçacıklar
        ctx.strokeStyle = "rgba(255,255,255,0.03)";
        ctx.lineWidth = 2;
        for (let x = 0; x <= gameState.map.width; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, gameState.map.height); ctx.stroke(); }
        for (let y = 0; y <= gameState.map.height; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(gameState.map.width, y); ctx.stroke(); }

        ctx.fillStyle = "rgba(255,255,255,0.5)";
        particles.forEach(p => {
            p.y -= p.speed;
            if(p.y < 0) p.y = gameState.map.height;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });

        // Oyuncuları Çiz
        for (let id in gameState.players) {
            let p = gameState.players[id];
            
            // Oyuncu İzi (Trail) Efekti
            if (!playerTrails[id]) playerTrails[id] = [];
            playerTrails[id].push({x: p.x, y: p.y, alpha: 1});
            if (playerTrails[id].length > 10) playerTrails[id].shift();

            for(let i=0; i<playerTrails[id].length; i++) {
                let trail = playerTrails[id][i];
                ctx.beginPath(); ctx.arc(trail.x, trail.y, 20 * (i/10), 0, Math.PI*2);
                ctx.fillStyle = p.color; ctx.globalAlpha = (i/10) * 0.3;
                ctx.fill();
            }
            ctx.globalAlpha = 1.0; // Saydamlığı sıfırla

            // Oyuncu Dairesi
            ctx.beginPath(); ctx.arc(p.x, p.y, 25, 0, Math.PI * 2);
            ctx.fillStyle = p.color; ctx.fill(); 
            ctx.shadowBlur = 25; ctx.shadowColor = p.color; ctx.fill(); ctx.shadowBlur = 0;
            
            // İç tasarım (Cam efekti)
            ctx.beginPath(); ctx.arc(p.x - 5, p.y - 5, 8, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.fill();

            // İsim Etiketi
            ctx.fillStyle = "white"; ctx.font = "bold 14px Poppins"; ctx.textAlign = "center";
            ctx.fillText(p.name, p.x, p.y + 45);

            // "Yazıyor..." Göstergesi
            if (p.isTyping && !p.msg) {
                ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "italic 12px Poppins";
                ctx.fillText("yazıyor...", p.x, p.y - 35);
            }

            // Mesaj Balonu
            if (p.msg) {
                ctx.font = "14px Poppins";
                let msgWidth = ctx.measureText(p.msg).width + 30;
                
                // Balon Arkaplanı
                ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                ctx.beginPath(); ctx.roundRect(p.x - msgWidth/2, p.y - 75, msgWidth, 35, 10); ctx.fill();
                
                // Balon Ok Ucu
                ctx.beginPath(); ctx.moveTo(p.x - 10, p.y - 40); ctx.lineTo(p.x + 10, p.y - 40); ctx.lineTo(p.x, p.y - 30); ctx.fill();
                
                // Yazı
                ctx.fillStyle = "black"; ctx.fillText(p.msg, p.x, p.y - 53);
            }
        }

        ctx.restore();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
