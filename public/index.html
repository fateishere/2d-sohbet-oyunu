<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>2D Pro Sohbet Dünyası</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
            user-select: none;
        }
        #loginModal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            width: 280px;
        }
        #gameCanvas {
            background-color: #1e293b;
            border: 3px solid #334155;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .ui-panel {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            width: 800px;
        }
        input, select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 14px;
        }
        .chat-input { flex: 1; }
        .btn {
            padding: 10px 18px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .emotes {
            display: flex;
            gap: 5px;
        }
        .emote-btn {
            background: #334155;
            border: none;
            font-size: 18px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }
        .emote-btn:hover { background: #475569; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- Giriş Ekranı -->
    <div id="loginModal">
        <h3 style="margin:0; text-align:center;">Karakterini Oluştur</h3>
        <input type="text" id="usernameInput" placeholder="Kullanıcı Adı" value="Oyuncu">
        <label>Avatar Seç:</label>
        <select id="avatarSelect">
            <option value="🐱">Kedi 🐱</option>
            <option value="🐶">Köpek 🐶</option>
            <option value="🤖">Robot 🤖</option>
            <option value="🦊">Tilki 🦊</option>
            <option value="😎">Havalı 😎</option>
            <option value="👑">Kral 👑</option>
        </select>
        <label>Renk Seç:</label>
        <select id="colorSelect">
            <option value="#ff4757">Kırmızı</option>
            <option value="#2ed573">Yeşil</option>
            <option value="#1e90ff">Mavi</option>
            <option value="#ffa502">Turuncu</option>
            <option value="#e056fd">Mor</option>
        </select>
        <button class="btn" onclick="startGame()">Dünyaya Gir</button>
    </div>

    <h2 style="margin: 5px 0;">2D Pro Multiplayer Chat</h2>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="ui-panel">
        <input type="text" id="chatInput" class="chat-input" placeholder="Mesaj yazıp Enter'a bas..." autocomplete="off">
        <button class="btn" onclick="sendMsg()">Gönder</button>
        
        <div class="emotes">
            <button class="emote-btn" onclick="sendEmote('❤️')">❤️</button>
            <button class="emote-btn" onclick="sendEmote('😂')">😂</button>
            <button class="emote-btn" onclick="sendEmote('🔥')">🔥</button>
            <button class="emote-btn" onclick="sendEmote('👍')">👍</button>
        </div>
    </div>

<script>
    const socket = io();
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const chatInput = document.getElementById("chatInput");

    let players = {};
    let coins = [];
    let walls = [];
    const keysPressed = {};

    socket.on("init", (data) => {
        walls = data.walls;
    });

    socket.on("state", (data) => {
        players = data.players;
        coins = data.coins;
        draw();
    });

    function startGame() {
        const name = document.getElementById("usernameInput").value.trim();
        const color = document.getElementById("colorSelect").value;
        const avatar = document.getElementById("avatarSelect").value;
        socket.emit("joinGame", { name, color, avatar });
        document.getElementById("loginModal").style.display = "none";
    }

    // Tuş basma durumları (Akıcı Hareket İçin)
    window.addEventListener("keydown", (e) => {
        if (document.activeElement === chatInput) {
            if (e.key === "Enter") sendMsg();
            return;
        }
        keysPressed[e.key] = true;
    });

    window.addEventListener("keyup", (e) => {
        delete keysPressed[e.key];
    });

    // Sürekli hareket kontrol döngüsü
    setInterval(() => {
        if (document.activeElement === chatInput) return;
        if (keysPressed["ArrowUp"] || keysPressed["w"] || keysPressed["W"]) socket.emit("move", "UP");
        if (keysPressed["ArrowDown"] || keysPressed["s"] || keysPressed["S"]) socket.emit("move", "DOWN");
        if (keysPressed["ArrowLeft"] || keysPressed["a"] || keysPressed["A"]) socket.emit("move", "LEFT");
        if (keysPressed["ArrowRight"] || keysPressed["d"] || keysPressed["D"]) socket.emit("move", "RIGHT");
    }, 30);

    function sendMsg() {
        const text = chatInput.value.trim();
        if (text !== "") {
            socket.emit("chat", text);
            chatInput.value = "";
        }
    }

    function sendEmote(emote) {
        socket.emit("sendEmote", emote);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 🟢 Harita Izgarası
        ctx.strokeStyle = "#283549";
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // 🟢 Engeller (Duvarlar)
        ctx.fillStyle = "#334155";
        for (let w of walls) {
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.strokeStyle = "#475569";
            ctx.strokeRect(w.x, w.y, w.w, w.h);
        }

        // 🟢 Altınlar / Yıldızlar
        for (let c of coins) {
            ctx.beginPath();
            ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = "#f1c40f";
            ctx.fill();
            ctx.strokeStyle = "#f39c12";
            ctx.stroke();
        }

        // 🟢 Oyuncular
        for (let id in players) {
            const p = players[id];

            // Karakter Dairesi
            ctx.beginPath();
            ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();

            // Avatar Simgesi
            ctx.font = "16px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(p.avatar, p.x, p.y + 6);

            // İsim ve Skor
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 12px Segoe UI";
            ctx.fillText(`${p.name} (${p.score}⭐)`, p.x, p.y + 36);

            // Emote (Hızlı İfade)
            if (p.emote) {
                ctx.font = "24px sans-serif";
                ctx.fillText(p.emote, p.x, p.y - 45);
            }

            // Sohbet Baloncuğu
            if (p.msg) {
                ctx.font = "12px Segoe UI";
                const textWidth = ctx.measureText(p.msg).width;
                ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
                ctx.fillRect(p.x - (textWidth/2) - 8, p.y - 42, textWidth + 16, 22);
                ctx.fillStyle = "#0f172a";
                ctx.fillText(p.msg, p.x, p.y - 27);
            }
        }
    }
</script>
</body>
</html>
