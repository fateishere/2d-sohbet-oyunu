<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>2D PC Sohbet Oyunu</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h2 { margin-bottom: 10px; }
        #gameCanvas {
            background-color: #2b2b3b;
            border: 3px solid #44445e;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .chat-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            width: 800px;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #44445e;
            background: #181825;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background: #a6e3a1;
            color: #11111b;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .info {
            margin-top: 10px;
            color: #a6adc8;
            font-size: 14px;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h2>2D Çok Oyunculu Sohbet Odası</h2>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="chat-container">
        <input type="text" id="chatInput" placeholder="Mesaj yazıp Enter'a bas..." autocomplete="off">
        <button onclick="sendMsg()">Gönder</button>
    </div>

    <div class="info">Hareket etmek için <b>W, A, S, D</b> veya <b>Yön Tuşlarını</b> kullan.</div>

<script>
    const socket = io();
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const chatInput = document.getElementById("chatInput");

    // Oyuncu İsmi Al
    let myName = prompt("Karakter adınızı girin:", "Oyuncu") || "Misafir";
    socket.emit("setName", myName);

    let players = {};

    socket.on("state", (serverPlayers) => {
        players = serverPlayers;
        draw();
    });

    // Klavye Hareket Dinleyicisi
    window.addEventListener("keydown", (e) => {
        // Eğer sohbet kutusuna yazıyorsa karakter hareket etmesin
        if (document.activeElement === chatInput) {
            if (e.key === "Enter") sendMsg();
            return;
        }

        if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") socket.emit("move", "UP");
        if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") socket.emit("move", "DOWN");
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") socket.emit("move", "LEFT");
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") socket.emit("move", "RIGHT");
    });

    function sendMsg() {
        const text = chatInput.value.trim();
        if (text !== "") {
            socket.emit("chat", text);
            chatInput.value = "";
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 🟢 Izgara Çizimi (Harita Hissiyatı)
        ctx.strokeStyle = "#363646";
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // 🟢 Oyuncuları Çiz
        for (let id in players) {
            const p = players[id];

            // Karakter (Daire)
            ctx.beginPath();
            ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();

            // İsim
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px Arial";
            ctx.textAlign = "center";
            ctx.fillText(p.name, p.x, p.y + 32);

            // Mesaj Baloncuğu
            if (p.msg) {
                ctx.font = "12px Arial";
                const textWidth = ctx.measureText(p.msg).width;
                
                // Arka plan kutucuğu
                ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
                ctx.fillRect(p.x - (textWidth/2) - 8, p.y - 42, textWidth + 16, 22);

                // Yazı
                ctx.fillStyle = "#000000";
                ctx.fillText(p.msg, p.x, p.y - 27);
            }
        }
    }
</script>
</body>
</html>
