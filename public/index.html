<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Çoklu Evren: Tank & Sohbet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');
        
        body { margin: 0; background: #050510; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; user-select: none; }
        
        /* Gelişmiş Menü */
        #menuUI { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .menu-box { background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); text-align: center; }
        h1 { font-family: 'Orbitron', sans-serif; color: #00fff5; text-shadow: 0 0 10px #00fff5; margin-bottom: 30px; }
        input, select { padding: 12px; width: 80%; margin-bottom: 15px; background: rgba(0,0,0,0.5); border: 1px solid #38bdf8; color: white; border-radius: 8px; outline: none; }
        .mode-btns { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .btn { padding: 15px 30px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; font-family: 'Orbitron', sans-serif; }
        .btn-tank { background: #ff4757; color: white; box-shadow: 0 0 15px #ff4757; }
        .btn-chat { background: #38bdf8; color: black; box-shadow: 0 0 15px #38bdf8; }
        .btn:hover { transform: scale(1.05); }

        /* Oyun Alanı */
        #gameArea { display: none; flex-direction: column; align-items: center; margin-top: 20px; position: relative; }
        canvas { background: #0a0a16; border: 2px solid #1e293b; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.8); cursor: crosshair; }
        
        /* Tank UI (Can ve Wave) */
        #hud { position: absolute; top: 10px; left: 10px; font-family: 'Orbitron', sans-serif; text-shadow: 1px 1px 2px black; display: none; }
        #waveText { color: #ff4757; font-size: 24px; }
        
        /* Sohbet Kutusu (Sadece Sohbet Modunda) */
        #chatPanel { display: none; width: 800px; margin-top: 15px; gap: 10px; }
        #chatPanel input { width: 100%; margin: 0; }

        /* Kart Seçim Ekranı (Hazırlık) */
        #cardScreen { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 40px; border-radius: 20px; border: 2px solid #00fff5; z-index: 50; text-align: center; }
        .card-container { display: flex; gap: 20px; margin-top: 20px; }
        .card { width: 150px; height: 200px; background: #1e293b; border: 2px solid #38bdf8; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 0 20px #38bdf8; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- GİRİŞ MENÜSÜ -->
    <div id="menuUI">
        <div class="menu-box">
            <h1>MULTIVERSE</h1>
            <input type="text" id="username" placeholder="Savaşçı Adın" value="Oyuncu">
            <select id="colorSelect">
                <option value="#00fff5">Neon Mavi</option>
                <option value="#ff4757">Lazer Kırmızı</option>
                <option value="#2ed573">Toksik Yeşil</option>
                <option value="#ffa502">Plazma Turuncu</option>
            </select>
            <div class="mode-btns">
                <button class="btn btn-chat" onclick="joinGame('chat')">Sohbet Modu</button>
                <button class="btn btn-tank" onclick="joinGame('tank')">Tank Savunması</button>
            </div>
        </div>
    </div>

    <!-- OYUN ALANI -->
    <div id="gameArea">
        <div id="hud"><span id="waveText">WAVE: 1</span></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="chatPanel">
            <input type="text" id="chatInput" placeholder="Mesaj gönder..." autocomplete="off">
            <button class="btn btn-chat" onclick="sendMsg()">Gönder</button>
        </div>
    </div>

    <!-- ROGUELITE KART SİSTEMİ (Altyapı) -->
    <div id="cardScreen">
        <h2 style="font-family: 'Orbitron'; color: #00fff5;">SEVİYE ATLANDI! ÖZELLİK SEÇ</h2>
        <div class="card-container">
            <div class="card" onclick="selectCard('damage')"><h3>Hasar +</h3><p>Mermiler %50 daha fazla vurur.</p></div>
            <div class="card" onclick="selectCard('speed')"><h3>Hız +</h3><p>Tank motoru güçlenir.</p></div>
            <div class="card" onclick="selectCard('multishot')"><h3>Çoklu Atış</h3><p>Aynı anda 3 mermi atar.</p></div>
        </div>
    </div>

<script>
    const socket = io();
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const chatInput = document.getElementById("chatInput");

    let currentMode = '';
    let gameState = null;
    const keys = {};

    function joinGame(mode) {
        currentMode = mode;
        const name = document.getElementById("username").value.trim();
        const color = document.getElementById("colorSelect").value;
        
        socket.emit("joinGame", { mode, name, color });
        
        document.getElementById("menuUI").style.display = "none";
        document.getElementById("gameArea").style.display = "flex";
        
        if(mode === 'chat') {
            document.getElementById("chatPanel").style.display = "flex";
            canvas.style.cursor = "default";
        } else {
            document.getElementById("hud").style.display = "block";
        }

        requestAnimationFrame(gameLoop);
    }

    // Gelen Veriler
    socket.on("gameState", (state) => { if(currentMode === 'chat') gameState = state; });
    socket.on("tankState", (state) => { 
        if(currentMode === 'tank') {
            gameState = state;
            document.getElementById("waveText").innerText = "WAVE: " + state.wave;
        }
    });

    socket.on("waveComplete", (newWave) => {
        // BURAYA KART SEÇİM EKRANINI AÇMA KODU GELECEK
        console.log("WAVE BİTTİ, YENİ WAVE:", newWave);
        // İleride: document.getElementById("cardScreen").style.display = "block";
    });

    // Kontroller
    window.addEventListener("keydown", (e) => {
        if (document.activeElement === chatInput) { if (e.key === "Enter") sendMsg(); return; }
        keys[e.key] = true;
    });
    window.addEventListener("keyup", (e) => delete keys[e.key]);

    // Fare Takibi (Tank Namlusu için)
    canvas.addEventListener("mousemove", (e) => {
        if(currentMode !== 'tank') return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const myTank = gameState?.players[socket.id];
        if (myTank) {
            const angle = Math.atan2(mouseY - myTank.y, mouseX - myTank.x);
            socket.emit("mouseAim", angle);
        }
    });

    // Ateş Etme
    canvas.addEventListener("mousedown", () => {
        if(currentMode === 'tank') socket.emit("shoot");
    });

    setInterval(() => {
        if (document.activeElement === chatInput) return;
        if (keys["w"] || keys["ArrowUp"]) socket.emit("move", "UP");
        if (keys["s"] || keys["ArrowDown"]) socket.emit("move", "DOWN");
        if (keys["a"] || keys["ArrowLeft"]) socket.emit("move", "LEFT");
        if (keys["d"] || keys["ArrowRight"]) socket.emit("move", "RIGHT");
    }, 30);

    function sendMsg() {
        if (chatInput.value.trim() !== "") { socket.emit("chat", chatInput.value); chatInput.value = ""; }
    }

    function selectCard(type) {
        // Sonraki aşamada burayı sunucuya bağlayacağız
        document.getElementById("cardScreen").style.display = "none";
    }

    // --- RENDER DÖNGÜSÜ ---
    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Arka plan ızgarası
        ctx.strokeStyle = "#1a1a2e";
        for (let x = 0; x < canvas.width; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
        for (let y = 0; y < canvas.height; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

        if (!gameState) { requestAnimationFrame(gameLoop); return; }

        if (currentMode === 'chat') {
            // SOHBET MODU ÇİZİMİ
            for (let id in gameState.players) {
                let p = gameState.players[id];
                ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.fill(); ctx.shadowBlur = 15; ctx.shadowColor = p.color;
                
                ctx.fillStyle = "white"; ctx.shadowBlur = 0; ctx.font = "14px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(p.name, p.x, p.y + 35);

                if (p.msg) {
                    ctx.fillStyle = "white"; ctx.fillRect(p.x - 50, p.y - 50, 100, 25);
                    ctx.fillStyle = "black"; ctx.fillText(p.msg, p.x, p.y - 33);
                }
            }
        } 
        else if (currentMode === 'tank') {
            // TANK MODU ÇİZİMİ
            
            // 1. Mermileri Çiz
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ffeb3b";
            for (let b of gameState.bullets) {
                ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
            }
            ctx.shadowBlur = 0;

            // 2. Düşmanları Çiz (Kırmızı Karemsi Botlar)
            for (let enemy of gameState.enemies) {
                ctx.fillStyle = "#ff0000";
                ctx.fillRect(enemy.x - 15, enemy.y - 15, 30, 30);
                
                // Düşman Can Barı
                ctx.fillStyle = "black"; ctx.fillRect(enemy.x - 15, enemy.y - 25, 30, 5);
                ctx.fillStyle = "#ff4757"; ctx.fillRect(enemy.x - 15, enemy.y - 25, 30 * (enemy.hp / (30 + gameState.wave * 10)), 5);
            }

            // 3. Oyuncu Tanklarını Çiz
            for (let id in gameState.players) {
                let p = gameState.players[id];
                
                ctx.save();
                ctx.translate(p.x, p.y);
                
                // İsim ve Skor
                ctx.fillStyle = "white"; ctx.font = "12px Orbitron"; ctx.textAlign = "center";
                ctx.fillText(`${p.name} (Skor: ${p.score})`, 0, 35);

                // Tank Gövdesi
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 15; ctx.shadowColor = p.color;
                ctx.fillRect(-15, -15, 30, 30);
                
                // Tank Namlusu (Döndürme işlemi)
                ctx.rotate(p.angle);
                ctx.fillStyle = "#cbd5e1";
                ctx.fillRect(0, -4, 25, 8); // Namlu borusu
                
                ctx.restore();
            }
        }

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
